[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensical-pymdownx"
version = "0.1.0"
description = "A theme customization for the Pymdown Extensions project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac Muse" }]
keywords = ["zensical", "mkdocs", "theme", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["zensical>=0.0.40"]

[project.optional-dependencies]
dev = ["zensical>=0.0.40", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/facelessuser/pymdownx-zensical-theme"

[project.entry-points."mkdocs.themes"]
zensical_pymdownx = "zensical_pymdownx"

[tool.hatch.build.targets.wheel]
packages = ["zensical_pymdownx"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE.md",
  "/README.md",
  "/pyproject.toml",
  "/zensical_pymdownx/**/*.py",
  "/zensical_pymdownx/**/*.js",
  "/zensical_pymdownx/**/*.css",
  "/zensical_pymdownx/**/*.html",
  "/zensical_pymdownx/**/*.yml",
]
